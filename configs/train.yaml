# @package _global_

paths:
  dataset_root: ${oc.env:SAM3_DATA_ROOT}
  annotation_file: ${oc.env:SAM3_ANNOTATION_FILE}
  checkpoint_path: ${oc.env:SAM3_CHECKPOINT}
  experiment_log_dir: ${oc.env:SAM3_RUN_DIR}
  bpe_path: ${oc.env:SAM3_SOURCE}/sam3/assets/bpe_simple_vocab_16e6.txt.gz

scratch:
  enable_segmentation: true
  num_train_workers: ${oc.decode:${oc.env:SAM3_WORKERS,8}}
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api_with_query_microbatching
    _partial_: true
    max_queries_per_microbatch: ${oc.decode:${oc.env:SAM3_QUERY_MICROBATCH_SIZE,64}}
    max_outputs_per_microbatch: ${oc.decode:${oc.env:SAM3_QUERY_MICROBATCH_MAX_OUTPUTS,400}}
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: true
  scheduler_timescale: ${oc.decode:${oc.env:SAM3_SCHEDULER_TIMESCALE,200}}
  train_batch_size: ${oc.decode:${oc.env:SAM3_LOCAL_BATCH,1}}
  gradient_accumulation_steps: ${oc.decode:${oc.env:SAM3_GRAD_ACCUM_STEPS,1}}
  lr_transformer: ${oc.decode:${oc.env:SAM3_LR_TRANSFORMER,1.6e-4}}
  lr_vision_backbone: ${oc.decode:${oc.env:SAM3_LR_VISION,2.5e-5}}
  lr_language_backbone: ${oc.decode:${oc.env:SAM3_LR_TEXT,1e-5}}

trainer:
  seed_value: ${oc.decode:${oc.env:SAM3_SEED,123}}
  max_epochs: ${oc.decode:${oc.env:SAM3_MAX_EPOCHS,1}}
  skip_saving_ckpts: false
  skip_first_val: true
  val_epoch_freq: 1000000
  distributed:
    find_unused_parameters: ${oc.decode:${oc.env:SAM3_FIND_UNUSED_PARAMETERS,true}}
    static_graph: ${oc.decode:${oc.env:SAM3_STATIC_GRAPH,false}}
    comms_dtype: ${oc.decode:${oc.env:SAM3_COMMS_DTYPE,null}}

  loss:
    all:
      _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
      matcher: ${scratch.matcher}
      o2m_weight: 2.0
      o2m_matcher:
        _target_: sam3.train.matcher.BinaryOneToManyMatcher
        alpha: 0.3
        threshold: 0.4
        topk: 4
      use_o2m_matcher_on_o2m_aux: false
      loss_fns_find:
        - _target_: sam3.train.loss.loss_fns.Boxes
          weight_dict: {loss_bbox: 5.0, loss_giou: 2.0}
        - _target_: sam3.train.loss.loss_fns.IABCEMdetr
          weak_loss: false
          weight_dict: {loss_ce: 20.0, presence_loss: 20.0}
          pos_weight: 10.0
          alpha: 0.25
          gamma: 2
          use_presence: true
          pos_focal: false
          pad_n_queries: 200
          pad_scale_pos: 1.0
        - _target_: sam3.train.loss.loss_fns.Masks
          focal_alpha: 0.25
          focal_gamma: 2.0
          weight_dict: {loss_mask: 200.0, loss_dice: 10.0}
          compute_aux: false
      loss_fn_semantic_seg: null
      scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        limit_ids: ${oc.decode:${oc.env:SAM3_LIMIT_IMAGES,null}}
        transforms: ${roboflow_train.train_transforms}
        load_segmentation: true
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 512
        max_val_queries: 512
        training: true
        use_caching: false
        img_folder: ${paths.dataset_root}
        ann_file: ${paths.annotation_file}
        coco_json_loader:
          _target_: sam3_sft.data.QueryJsonLoader
          _partial_: true
      shuffle: true
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: true
      drop_last: true
      collate_fn: ${scratch.collate_fn}
    val: null

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    load_from_HF: false
    checkpoint_path: ${paths.checkpoint_path}
    enable_segmentation: true
    freeze_policy: ${oc.env:SAM3_FREEZE_POLICY,tfdm}
    activation_checkpointing: ${oc.decode:${oc.env:SAM3_ACTIVATION_CHECKPOINTING,true}}
    activation_checkpoint_mode: ${oc.env:SAM3_ACTIVATION_CHECKPOINT_MODE,all}
    compile_vision_only: ${oc.decode:${oc.env:SAM3_COMPILE_VISION_ONLY,false}}

  meters: {}

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1

launcher:
  num_nodes: 1
  gpus_per_node: 8
  experiment_log_dir: ${paths.experiment_log_dir}

submitit:
  use_cluster: false
  timeout_hour: 24
  cpus_per_task: 8
